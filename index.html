<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Investment Monitoring Dashboard — Real-time leaderboard analytics, competitor tracking, dan bot decision log." />
  <meta name="keywords" content="investment monitoring, leaderboard analytics, bot status, class competition" />
  <meta name="author" content="InvestCalc" />
  <meta property="og:title" content="Investment Monitoring Dashboard" />
  <meta property="og:description" content="Real-time monitoring dashboard untuk kompetisi investasi antar kelas." />
  <title>Investment Monitoring Dashboard</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- External CDN Libraries -->
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>

  <!-- Firebase CDN (compat - no bundler needed) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>

<body>

  <!-- Auth Overlay (Industrial Terminal Gateway) -->
  <div id="auth-overlay" style="position:fixed; inset:0; background:rgba(7,7,9,0.98); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px;">
    <div style="background:#121215; border:1px solid rgba(255,255,255,0.08); border-top:2px solid #f59e0b; border-radius:4px; padding:32px 30px; width:100%; max-width:390px; box-shadow:0 16px 48px rgba(0,0,0,0.85); display:flex; flex-direction:column; gap:18px;">
      
      <!-- Terminal Header -->
      <div style="border-bottom:1px solid rgba(255,255,255,0.06); padding-bottom:14px;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
          <span style="font-family:'IBM Plex Mono',monospace; font-size:10px; color:#f59e0b; letter-spacing:0.14em; text-transform:uppercase; font-weight:600;">SYS//SECURE-AUTH</span>
          <span style="display:inline-flex; align-items:center; gap:6px; font-family:'IBM Plex Mono',monospace; font-size:10px; color:#22c55e;">
            <span style="width:6px; height:6px; border-radius:50%; background:#22c55e; box-shadow:0 0 8px #22c55e;"></span> ONLINE
          </span>
        </div>
        <div style="font-family:'IBM Plex Mono',monospace; font-size:18px; font-weight:700; color:#f0f0f0; letter-spacing:-0.01em;">INVEST_MONITOR</div>
        <div style="font-size:11px; color:#8b8b96; margin-top:3px; letter-spacing:0.02em;">Akses terbatas untuk operator terverifikasi.</div>
      </div>

      <!-- Google Sign In Button -->
      <button id="google-login-btn" type="button"
        style="width:100%; display:flex; align-items:center; justify-content:center; gap:10px; padding:10px 14px; border-radius:3px; border:1px solid rgba(255,255,255,0.12); background:#1a1a1e; color:#f0f0f0; font-family:'IBM Plex Sans',sans-serif; font-weight:600; font-size:13px; cursor:pointer; transition:all 0.15s ease;">
        <svg width="16" height="16" viewBox="0 0 24 24" style="flex-shrink:0;">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Masuk dengan Google</span>
      </button>

      <!-- Terminal Divider -->
      <div style="display:flex; align-items:center; width:100%; gap:10px;">
        <div style="flex:1; height:1px; background:rgba(255,255,255,0.06);"></div>
        <span style="font-family:'IBM Plex Mono',monospace; font-size:10px; color:#4a4a55; text-transform:uppercase; letter-spacing:0.1em;">atau kredensial</span>
        <div style="flex:1; height:1px; background:rgba(255,255,255,0.06);"></div>
      </div>

      <!-- Email / Password Form -->
      <form id="email-login-form" style="width:100%; display:flex; flex-direction:column; gap:9px;">
        <input id="auth-email" type="email" placeholder="email@operator.domain" required
          style="padding:9px 12px; border-radius:3px; border:1px solid rgba(255,255,255,0.08); background:#0c0c0e; color:#f0f0f0; font-family:'IBM Plex Mono',monospace; font-size:12px; outline:none; width:100%; box-sizing:border-box;" />
        <input id="auth-password" type="password" placeholder="••••••••" required
          style="padding:9px 12px; border-radius:3px; border:1px solid rgba(255,255,255,0.08); background:#0c0c0e; color:#f0f0f0; font-family:'IBM Plex Mono',monospace; font-size:12px; outline:none; width:100%; box-sizing:border-box;" />
        <button id="email-login-btn" type="submit"
          style="padding:10px 14px; border-radius:3px; border:none; background:#f59e0b; color:#0a0a0b; font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12px; letter-spacing:0.04em; cursor:pointer; text-transform:uppercase; margin-top:2px; transition:opacity 0.15s ease;">
          Autentikasi Email
        </button>
      </form>

      <!-- Alert Box -->
      <div id="auth-error" style="display:none; padding:9px 12px; border-radius:3px; background:rgba(239,68,68,0.08); border:1px solid rgba(239,68,68,0.3); color:#fca5a5; font-family:'IBM Plex Mono',monospace; font-size:11px; line-height:1.4; text-align:left; width:100%; box-sizing:border-box;"></div>
      <div id="auth-status" style="display:none; padding:9px 12px; border-radius:3px; background:rgba(245,158,11,0.08); border:1px solid rgba(245,158,11,0.3); color:#fde68a; font-family:'IBM Plex Mono',monospace; font-size:11px; line-height:1.4; text-align:left; width:100%; box-sizing:border-box;"></div>
    </div>
  </div>

  <div class="app-shell" role="main">

    <!-- Sidebar tersembunyi (tidak dipakai di monitoring mode) -->
    <aside id="config-panel" aria-label="Configuration Panel" style="display:none;"></aside>

    <!-- Main Content Area -->
    <section id="main-content" aria-label="Monitoring Dashboard">
      <!-- Filled by app.js -->
    </section>

  </div><!-- /.app-shell -->

  <!-- UI Scripts (Monitoring) -->
  <script src="js/ui/bot_status.js"></script>
  <script src="js/ui/leaderboard_analytics.js"></script>

  <!-- Firebase Integration -->
  <script src="js/firebase.js"></script>

  <!-- App Orchestrator (Monitoring) -->
  <script src="js/app.js"></script>

</body>
</html>
