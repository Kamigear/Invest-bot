<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Investment Monitoring Dashboard — Real-time leaderboard analytics, competitor tracking, dan bot decision log." />
  <meta name="keywords" content="investment monitoring, leaderboard analytics, bot status, class competition" />
  <meta name="author" content="InvestCalc" />
  <meta property="og:title" content="Investment Monitoring Dashboard" />
  <meta property="og:description" content="Real-time monitoring dashboard untuk kompetisi investasi antar kelas." />
  <title>Investment Monitoring Dashboard</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- External CDN Libraries -->
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>

  <!-- Firebase CDN (compat - no bundler needed) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>

<body>

  <!-- Auth Overlay (password gate) -->
  <div id="auth-overlay" style="display:none; position:fixed; inset:0; background:rgba(9,9,18,0.97); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;">
    <div style="font-size:48px;">📊</div>
    <div style="font-size:22px; font-weight:700; color:#e2e8f0;">Investment Monitor</div>
    <div style="font-size:14px; color:#94a3b8;">Masukkan password untuk melanjutkan</div>
    <input id="auth-input" type="password" placeholder="Password..."
      style="padding:12px 18px; border-radius:10px; border:1px solid rgba(255,255,255,0.12); background:#1a1a2e; color:#e2e8f0; font-size:15px; width:260px; outline:none;" />
    <button id="auth-btn"
      style="padding:12px 36px; border-radius:10px; border:none; background:linear-gradient(135deg,#4facfe,#00f2fe); color:#0f0f1a; font-weight:700; font-size:15px; cursor:pointer;">
      Masuk
    </button>
    <div id="auth-error" style="display:none; color:#ef4444; font-size:13px;">Password salah. Coba lagi.</div>
    <a id="auth-setup-link" href="#" style="font-size:12px; color:#475569; margin-top:8px;">Buat password baru</a>
  </div>

  <div class="app-shell" role="main">

    <!-- Sidebar tersembunyi (tidak dipakai di monitoring mode) -->
    <aside id="config-panel" aria-label="Configuration Panel" style="display:none;"></aside>

    <!-- Main Content Area -->
    <section id="main-content" aria-label="Monitoring Dashboard">
      <!-- Filled by app.js -->
    </section>

  </div><!-- /.app-shell -->

  <!-- UI Scripts (Monitoring) -->
  <script src="js/ui/bot_status.js"></script>
  <script src="js/ui/leaderboard_analytics.js"></script>

  <!-- Firebase Integration -->
  <script src="js/firebase.js"></script>

  <!-- App Orchestrator (Monitoring) -->
  <script src="js/app.js"></script>

</body>
</html>
