<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Investment Monitoring Dashboard — Real-time leaderboard analytics, competitor tracking, dan bot decision log." />
  <meta name="keywords" content="investment monitoring, leaderboard analytics, bot status, class competition" />
  <meta name="author" content="InvestCalc" />
  <meta property="og:title" content="Investment Monitoring Dashboard" />
  <meta property="og:description" content="Real-time monitoring dashboard untuk kompetisi investasi antar kelas." />
  <title>Investment Monitoring Dashboard</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- External CDN Libraries -->
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>

  <!-- Firebase CDN (compat - no bundler needed) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>

<body>

  <!-- Auth Overlay (Secure Gate) -->
  <div id="auth-overlay" style="position:fixed; inset:0; background:rgba(9,9,18,0.98); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:20px;">
    <div style="background:#16162a; border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:32px 28px; width:100%; max-width:380px; box-shadow:0 20px 40px rgba(0,0,0,0.6); display:flex; flex-direction:column; align-items:center; gap:16px; text-align:center;">
      <div style="width:52px; height:52px; border-radius:12px; background:linear-gradient(135deg, rgba(79,172,254,0.15), rgba(0,242,254,0.15)); border:1px solid rgba(79,172,254,0.3); display:flex; align-items:center; justify-content:center; font-size:26px;">
        🔒
      </div>
      <div>
        <div style="font-size:20px; font-weight:700; color:#f1f5f9;">Investment Monitor</div>
        <div style="font-size:13px; color:#94a3b8; margin-top:4px;">Akses khusus pemilik dashboard & analitik</div>
      </div>

      <!-- Google Sign In Button -->
      <button id="google-login-btn" type="button"
        style="width:100%; display:flex; align-items:center; justify-content:center; gap:12px; padding:11px 16px; border-radius:10px; border:1px solid rgba(255,255,255,0.15); background:#ffffff; color:#1e293b; font-weight:600; font-size:14px; cursor:pointer; transition:all 0.2s ease;">
        <svg width="18" height="18" viewBox="0 0 24 24" style="flex-shrink:0;">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Masuk dengan Google</span>
      </button>

      <div style="display:flex; align-items:center; width:100%; gap:12px; margin:2px 0;">
        <div style="flex:1; height:1px; background:rgba(255,255,255,0.1);"></div>
        <span style="font-size:12px; color:#64748b;">atau email</span>
        <div style="flex:1; height:1px; background:rgba(255,255,255,0.1);"></div>
      </div>

      <!-- Email / Password Form -->
      <form id="email-login-form" style="width:100%; display:flex; flex-direction:column; gap:10px;">
        <input id="auth-email" type="email" placeholder="Email admin..." required
          style="padding:10px 14px; border-radius:8px; border:1px solid rgba(255,255,255,0.12); background:#0f0f1a; color:#e2e8f0; font-size:13px; outline:none; width:100%; box-sizing:border-box;" />
        <input id="auth-password" type="password" placeholder="Password..." required
          style="padding:10px 14px; border-radius:8px; border:1px solid rgba(255,255,255,0.12); background:#0f0f1a; color:#e2e8f0; font-size:13px; outline:none; width:100%; box-sizing:border-box;" />
        <button id="email-login-btn" type="submit"
          style="padding:10px 16px; border-radius:8px; border:none; background:linear-gradient(135deg,#4facfe,#00f2fe); color:#0f0f1a; font-weight:700; font-size:13px; cursor:pointer;">
          Masuk dengan Email
        </button>
      </form>

      <!-- Alert Box -->
      <div id="auth-error" style="display:none; padding:10px 14px; border-radius:8px; background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.3); color:#fca5a5; font-size:12px; line-height:1.4; text-align:left; width:100%; box-sizing:border-box;"></div>
      <div id="auth-status" style="display:none; padding:10px 14px; border-radius:8px; background:rgba(59,130,246,0.15); border:1px solid rgba(59,130,246,0.3); color:#93c5fd; font-size:12px; line-height:1.4; text-align:left; width:100%; box-sizing:border-box;"></div>
    </div>
  </div>

  <div class="app-shell" role="main">

    <!-- Sidebar tersembunyi (tidak dipakai di monitoring mode) -->
    <aside id="config-panel" aria-label="Configuration Panel" style="display:none;"></aside>

    <!-- Main Content Area -->
    <section id="main-content" aria-label="Monitoring Dashboard">
      <!-- Filled by app.js -->
    </section>

  </div><!-- /.app-shell -->

  <!-- UI Scripts (Monitoring) -->
  <script src="js/ui/bot_status.js"></script>
  <script src="js/ui/leaderboard_analytics.js"></script>

  <!-- Firebase Integration -->
  <script src="js/firebase.js"></script>

  <!-- App Orchestrator (Monitoring) -->
  <script src="js/app.js"></script>

</body>
</html>
