name: Invest Bot Automation

on:
  schedule:
    # 21:00 UTC = 04:00 WIB (Claim Daily: Klaim Streak 30+, Perk, Easter Egg, Invest jika ada jadwal)
    - cron: '0 21 * * *'
    # 16:00 UTC = 23:00 WIB (Decision Engine: Evaluasi Otomatis Rule 1-4)
    - cron: '0 16 * * *'
    # Setiap 1 jam (Leaderboard Analytics: Scrape & Pantau Kompetitor)
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'Pilih tugas yang ingin dijalankan'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - claim_daily
          - invest
          - decision
          - analytics

# Batasi hanya 1 run yang berjalan di waktu bersamaan (mencegah bentrok)
concurrency:
  group: invest-bot-execution
  cancel-in-progress: false

jobs:
  run-bot:
    name: Execute Bot Task
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache node_modules
        id: node-cache
        uses: actions/cache@v4
        with:
          path: Board/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('Board/package-lock.json', 'Board/package.json') }}

      - name: Install Dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        working-directory: Board
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm install

      - name: Execute Runner
        working-directory: Board
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'invest-bot-3e7a9' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          REP_PANEL_URL: ${{ secrets.REP_PANEL_URL || 'https://boardleaders.rf.gd/rep_panel.php' }}
          REP_CLASS_ID: ${{ secrets.REP_CLASS_ID || '4' }}
          REP_PASSWORD: ${{ secrets.REP_PASSWORD }}
          ALERT_ENABLED: ${{ secrets.ALERT_ENABLED || 'true' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'Invest-bot' }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER || 'https://ntfy.sh' }}
          NTFY_AUTH_TOKEN: ${{ secrets.NTFY_AUTH_TOKEN || '' }}
          INVEST_ENABLED: ${{ secrets.INVEST_ENABLED || 'true' }}
          DAILY_REWARD_ENABLED: ${{ secrets.DAILY_REWARD_ENABLED || 'true' }}
          LEADERBOARD_URL: ${{ secrets.LEADERBOARD_URL || 'https://boardleaders.rf.gd/' }}
        run: |
          TASK="${{ inputs.task || 'auto' }}"
          echo "Menjalankan task: $TASK"
          node runner.js "$TASK"